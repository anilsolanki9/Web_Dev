<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Card Webpage</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrapper">
            <div class="card">
                <div class="image"></div>
                <div class="desc">
                    <p id="title" class="text">cofee mug</p>
                    <h2 class="heading top">white cofee mug</h2>
                    <p class="text">
                        Cofee Mugs are designed to express emptions. These are acclaimed for their
                        amazing designs & superior quality.
                    </p>
                    <div class="price-div">
                        <span class="heading new-price">&#8377;149 </span>
                        <span class="old-price text"><s>&#8377;230</s></span>
                    </div>
                    <button>
                        <img
                            id="cart"
                            src="./assets/images/cart.png"
                            alt="Cart png"
                            height="16px" />
                        <span class="text">Add to Cart</span>
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
