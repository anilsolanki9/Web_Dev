<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product Card</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <section>
                <div class="imgContainer">
                    <img src="./image/mug.jpg" alt="Cofee Mug Image" />
                </div>
                <div class="details">
                    <p class="desc top">COFFEE MUG</p>
                    <h2 class="productTitle">White Coffee <br />Mug</h2>
                    <p class="desc">
                        Coffee Mugs are designed to express emotions. These are acclaimed for their
                        amazing designs & superior quality.
                    </p>
                    <p class="prices">
                        <span class="sellPrice productTitle">₹149</span>
                        <span class="desc originalPrice">₹230</span>
                    </p>
                    <button class="btn">
                        <img class="btnImg" src="./image/icon-cart.png" alt="" />
                        <span class="desc btnText">Add to Cart</span>
                    </button>
                </div>
            </section>
        </main>
    </body>
</html>
