<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap');
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #f5f5f5;
            }

            .contianer {
                margin: 0 auto;
                width: 1500px;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .card {
                width: 1000px;
                height: 600px;
                border-radius: 10px;
                box-shadow: 10px 10px 5px rgba(0, 0, 0, 0.2);
                position: relative;
            }

            .card img {
                position: absolute;
                width: 100%;
                height: 100%;
                border-radius: 10px;
                object-fit: cover;
                z-index: -1;
            }

            .caption {
                position: relative;
                /* bottom: 1;
                left: 0; */
                top: 300px;
                width: 100%;
                height: 50%;
                background-color: rgba(0, 0, 0, 0.5);
                padding: 10px;
                color: #fff;
                border-radius: 0 0 10px 10px;
            }

            .caption h2 {
                font-family: 'Caveat';
                font-size: 4rem;
                margin-bottom: 10px;
            }

            .caption p {
                font-size: 2rem;
                line-height: 1.5;
                font-family: 'Caveat';
            }
        </style>
    </head>
    <body>
        <main class="contianer">
            <div class="card">
                <img
                    src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg?cs=srgb&dl=pexels-mike-b-170811.jpg&fm=jpg&w=640&h=360"
                    alt="car image" />
                <div class="caption">
                    <h2>Card Title</h2>
                    <p>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam quod,
                        voluptate, quia, voluptates quae voluptatibus quibusdam voluptatum quos quas
                        quidem quia voluptates quae voluptatibus voluptatum quos quas quidem quia
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
