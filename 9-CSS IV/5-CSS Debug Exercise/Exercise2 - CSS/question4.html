<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            height: 100vh;
            margin: 0 200px;
            display: flex;
            gap: 12px;
            overflow-x: hidden;
            overflow-y: auto;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            position: relative;
        }
        .music-card {
            min-width: 45%;
            display: inline;
            height: 17vh;
            background-color: #1f1f1f;
            color: white;
            font-family: 'Gill Sans', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 8px;
            transition: any 0.3sec;
            box-shadow: 2px 2px 5px #606060a9;
        }
        .music-card:hover {
            background: #1f1f1fb9;
        }
        .music-card img {
            border-radius: 8px 0 0 8px;
            height: 100%;
        }

        h2 {
            display: inline;
            position: relative;
            bottom: 50px;
            left: 20px;
        }
    </style>
    <body>
        <div class="container">
            <div class="music-card">
                <img src="https://static-cse.canva.com/blob/978202/1600w-YmFtIRl8-qo.jpg" alt="" />
                <h2>Liked Songs</h2>
            </div>
            <div class="music-card">
                <img
                    src="https://cdn.musicvine.com/images/good-vibes-collection-cover-v2_5528980777329875.jpg"
                    alt="" />
                <h2>Happy Vibes</h2>
            </div>
            <div class="music-card">
                <img
                    src="https://source.boomplaymusic.com/group10/M00/01/20/d67f8dbb5a304aa4bdaae5c9786fc18eH3000W3000_464_464.webp"
                    alt="" />
                <h2>Arijit Singh Mix</h2>
            </div>
            <div class="music-card">
                <img
                    src="https://i.scdn.co/image/ab67616d00001e028dce351c5e4a62c2ea2dd498"
                    alt="" />
                <h2>Vaaste</h2>
            </div>
            <div class="music-card">
                <img
                    src="https://a10.gaanacdn.com/images/albums/93/3398093/crop_480x480_3398093.jpg"
                    alt="" />
                <h2>The Carnival</h2>
            </div>
            <div class="music-card">
                <img
                    src="https://c.saavncdn.com/735/Sanam-Best-Is-Back-Hindi-2016-500x500.jpg"
                    alt="" />
                <h2>This Is Sanam</h2>
            </div>
        </div>
    </body>
</html>
